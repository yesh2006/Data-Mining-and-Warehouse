services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-annapurna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-annapurna}
    ports:
      - "5432:5432"
    volumes:
      - annapurna_pg:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: annapurna-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CHANGE_ME}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - annapurna_minio:/data

volumes:
  annapurna_pg:
  annapurna_minio:
